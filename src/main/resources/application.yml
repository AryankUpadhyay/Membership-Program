server:
  port: 8080

spring:
  application:
    name: firstclub-membership-program

  datasource:
    url: jdbc:h2:mem:membershipdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.firstclub: DEBUG
    org.hibernate.SQL: WARN

membership:
  scheduler:
    expiry-check-cron: "0 0 0 * * *"   # daily at midnight
    tier-eval-cron: "0 0 1 * * *"       # daily at 1 AM
